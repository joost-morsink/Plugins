name: CI

# build and test on every push to main and on pull requests, on the systems the tools run on
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test BitWizards.Plugins.sln --configuration Release

  pack:
    # the packages must be possible to make: this is what the publish workflow does
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet pack BitWizards.Plugins.sln --configuration Release --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: dist/*.nupkg
